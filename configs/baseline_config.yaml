baseline_experiment:
  seed: 42
  text_column: "statement"
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    sublinear_tf: true
    min_df: 2
    max_df: 0.95
    stop_words: "english"
  # Leakage-free numeric features. The raw LIAR credit-history counts
  # (barely_true_c ... pants_fire_c) are excluded by design: they include the
  # current statement's own label and aggregate over the held-out splits.
  # See src/features/credit_history.py.
  numeric_features:
    - "hist_p_pants_fire_zscore"
    - "hist_p_false_zscore"
    - "hist_p_barely_true_zscore"
    - "hist_p_half_true_zscore"
    - "hist_p_mostly_true_zscore"
    - "hist_p_true_zscore"
    - "credibility_score_zscore"
    - "speaker_history_log_size_zscore"
    - "speaker_is_unseen"
    - "statement_char_len_zscore"
    - "statement_word_count_zscore"
    - "avg_word_length_zscore"
  categorical_features:
    - "party"
    - "state"
  models:
    logistic_regression:
      max_iter: 1000
      C: 1.0
      solver: "lbfgs"
    linear_svc:
      max_iter: 2000
      C: 1.0
    sgd_classifier:
      loss: "modified_huber"
      max_iter: 1000
      alpha: 0.0001
    multinomial_nb:
      alpha: 1.0
    random_forest:
      n_estimators: 100
      max_depth: 25
      n_jobs: -1
    extra_trees:
      n_estimators: 100
      max_depth: 25
      n_jobs: -1
